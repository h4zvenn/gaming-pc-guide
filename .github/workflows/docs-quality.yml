name: docs-quality

on:
  pull_request:
  push:
	branches: [ main ]

jobs:
  markdown-and-links:
	runs-on: ubuntu-latest
	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Markdown lint
		uses: DavidAnson/markdownlint-cli2-action@v16
		with:
		  globs: |
			**/*.md

	  - name: Link check
		uses: lycheeverse/lychee-action@v2
		with:
		  args: --no-progress --verbose --exclude-mail **/*.md
		env:
		  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
