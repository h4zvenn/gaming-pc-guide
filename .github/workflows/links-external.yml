name: links-external

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          args: >-
            --no-progress
            --verbose
            --hidden
            --max-concurrency 4
            --max-retries 2
            --retry-wait-time 5
            --timeout 30
            --exclude '^mailto:'
            --exclude '^https://modhub\.wargaming\.com/'
            --exclude '^https://github\.com/h4zvenn/gaming-pc-guide/(issues|discussions)'
            './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-check-report
          path: lychee/out.md
          if-no-files-found: ignore
