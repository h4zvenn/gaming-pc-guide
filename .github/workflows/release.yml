name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              sys.exit(f"Invalid release tag: {tag}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = changelog.splitlines()
          heading = re.compile(rf"^## {re.escape(tag)}(?:\s+-\s+.*)?$")

          for index, line in enumerate(lines):
              if heading.fullmatch(line):
                  end = next(
                      (position for position in range(index + 1, len(lines))
                       if lines[position].startswith("## ")),
                      len(lines),
                  )
                  notes = "\n".join(lines[index + 1:end]).strip()
                  if not notes:
                      sys.exit(f"No release notes found under {line}")
                  Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
                  break
          else:
              sys.exit(f"CHANGELOG.md has no heading for {tag}")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
