<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/docs/01-before-you-start/' | relative_url }}">Start</a>
        <a href="{{ '/docs/02-find-the-bottleneck/' | relative_url }}">Bottleneck</a>
        <a href="{{ '/docs/06-gpu-settings/' | relative_url }}">GPU</a>
        <a href="{{ '/docs/15-troubleshooting-decision-trees/' | relative_url }}">Troubleshoot</a>
        <a href="{{ '/docs/16-benchmark-templates/' | relative_url }}">Benchmark</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Windows 11 Gaming PC Optimization Guide · MIT License</p>
      <p><a href="https://github.com/h4zvenn/gaming-pc-guide">GitHub</a> · <a href="https://github.com/h4zvenn/gaming-pc-guide/issues">Issues</a> · <a href="https://github.com/h4zvenn/gaming-pc-guide/discussions">Discussions</a></p>
    </div>
  </footer>
</body>
</html>
