title: Windows 11 Gaming PC Optimization Guide
description: Practical guide for tuning a Windows 11 gaming PC.
baseurl: "/gaming-pc-guide"
url: "https://h4zvenn.github.io"
markdown: kramdown


lang: en


defaults:
  - scope:
      path: ""
    values:
      lang: en


  - scope:
      path: "docs"
    values:
      layout: doc


  - scope:
      path: "ru"
    values:
      lang: ru


  - scope:
      path: "ru/docs"
    values:
      layout: doc


exclude:
  - .git
  - .github
  - .markdownlint-cli2.jsonc
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - LICENSE
  - SECURITY.md